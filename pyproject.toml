[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wnm-3d"
description = "A World Navigation Model with 3D Scene Conditioning for Closed-Loop VLN"
version = "1.0.0"
readme = "README.md"
license = "Apache-2.0 AND LicenseRef-FAIR-Noncommercial-Research AND LicenseRef-DINOv3"
license-files = [
    "LICENSE",
    "COPYRIGHT",
    "docs/THIRD_PARTY_NOTICES.md",
    "LICENSES/*",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
    {name = "Yuehao Huang", email = "yuehaohuang@zju.edu.cn"}
]
requires-python = "~=3.11,<3.13"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "numpy==1.26.4",
    "hydra-core>=1.3",
    "peft==0.5.0",
    "tyro",
    "pandas",
    "pyarrow",
    "dm_tree",
    "pydantic>=2",
    "pyyaml",
    "tqdm",
    "transformers==4.51.3",
    "accelerate>=1.0",
    "albumentations==1.4.18",
    "einops==0.8.1",
    "imageio==2.34.2",
    "imageio-ffmpeg",
    "opencv-python-headless>=4.9,<4.12",
    "diffusers==0.30.2",
    "ftfy",
    "regex",
    "msgpack-numpy==0.4.8",
    "openpi-client==0.1.1",
    "huggingface_hub",
    "deepspeed",
    "safetensors",
    "sentencepiece",
    "pillow",
    "tensorboard",
    "websockets>=14"
]

[project.optional-dependencies]
gpu = [
    "flash-attn>=2.8",
]
tracking = [
    "wandb",
]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "ruff>=0.15.0",
]

[project.urls]
Homepage = "https://wnm-3d.github.io/"
Paper = "https://arxiv.org/abs/2608.07267"
Repository = "https://github.com/TeleHuman/WNM-3D"
Models = "https://huggingface.co/TeleEmbodied/WNM-3D"

[tool.setuptools.packages.find]
where = ["."]
include = ["gammanav*"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
gammanav = [
    "vln/configs/**/*.yaml",
    "vln/configs/**/*.json",
]

[tool.ruff]
target-version = "py311"
extend-exclude = [
    "gammanav/vln/model/wnm_3d/modules/vggt_omega",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
